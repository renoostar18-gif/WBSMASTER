<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
@font-face{font-family:"Plex";src:url(assets/fonts/IBMPlexSans-400.ttf);font-weight:400}
@font-face{font-family:"Plex";src:url(assets/fonts/IBMPlexSans-500.ttf);font-weight:500}
@font-face{font-family:"Plex";src:url(assets/fonts/IBMPlexSans-600.ttf);font-weight:600}
@font-face{font-family:"Plex";src:url(assets/fonts/IBMPlexSans-700.ttf);font-weight:700}
@font-face{font-family:"PlexMono";src:url(assets/fonts/IBMPlexMono-600.ttf);font-weight:600}
:root{--ground:#0B1218;--panel:#121C24;--ink:#EEF4F2;--muted:#9FB0B8;--teal:#2FC7B4;--teal2:#08776C;--l2:#6FA9FF;--l3:#CB94FF;--l4:#FFA057;--red:#FF6A5C}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--ground)}
#root{position:relative;width:1920px;height:1080px;font-family:"Plex",sans-serif;color:var(--ink);overflow:hidden;background:radial-gradient(1200px 700px at 78% 30%,#12302C 0%,rgba(11,18,24,0) 70%),var(--ground)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:96px 96px}
.bars{position:absolute;right:120px;top:210px;width:780px;height:660px}
.bar{position:absolute;height:34px;border-radius:8px}
.bar i{position:absolute;inset:0;border-radius:8px}
.lbl{position:absolute;left:150px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;width:920px}
.kick{font:600 26px/1 "Plex";letter-spacing:.22em;text-transform:uppercase;color:var(--teal)}
.num{font:600 210px/0.9 "PlexMono";color:transparent;-webkit-text-stroke:3px rgba(47,199,180,.75);margin:22px 0 10px}
.ttl{font:700 92px/1.04 "Plex";letter-spacing:-.025em;text-wrap:balance}
.sub{font:400 34px/1.35 "Plex";color:var(--muted);margin-top:26px;max-width:860px}
.rule{height:6px;width:140px;background:var(--teal);border-radius:3px;margin-top:40px;transform-origin:left center}
.brand{position:absolute;left:150px;bottom:84px;display:flex;align-items:center;gap:16px;font:600 26px "Plex";letter-spacing:.02em;color:var(--ink)}
.mark{display:grid;grid-template-columns:repeat(2,16px);gap:5px}
.mark b{width:16px;height:16px;border-radius:3px;background:var(--teal)}
.mark b:nth-child(1){opacity:.55}.mark b:nth-child(4){opacity:.55}
.foot{position:absolute;right:150px;bottom:88px;font:500 24px "Plex";color:var(--muted)}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="7" data-width="1920" data-height="1080"
  data-composition-variables='[{"id":"kind","type":"string","label":"Kind","default":"section"},{"id":"num","type":"string","label":"Number","default":"05"},{"id":"title","type":"string","label":"Title","default":"Building and editing the WBS"},{"id":"kicker","type":"string","label":"Kicker","default":"Chapter 05"},{"id":"sub","type":"string","label":"Subtitle","default":"Chart, Table and side panel"},{"id":"dur","type":"number","label":"Duration","default":4}]'>
  <div class="grid clip" id="grid" data-start="0" data-duration="7"></div>
  <div class="bars clip" id="bars" data-start="0" data-duration="7">
    <div class="bar" id="b1" style="left:0;top:40px;width:420px"><i style="background:var(--teal)"></i></div>
    <div class="bar" id="b2" style="left:120px;top:120px;width:300px"><i style="background:var(--l2)"></i></div>
    <div class="bar" id="b3" style="left:260px;top:200px;width:380px"><i style="background:var(--l3)"></i></div>
    <div class="bar" id="b4" style="left:420px;top:280px;width:240px"><i style="background:var(--l4)"></i></div>
    <div class="bar" id="b5" style="left:540px;top:360px;width:200px"><i style="background:var(--teal)"></i></div>
    <div class="bar" id="b6" style="left:330px;top:440px;width:330px"><i style="background:var(--red)"></i></div>
    <div class="bar" id="b7" style="left:600px;top:520px;width:170px"><i style="background:var(--l2)"></i></div>
  </div>
  <div class="lbl clip" id="lbl" data-start="0" data-duration="7">
    <div class="kick" id="kick"></div>
    <div class="num" id="num"></div>
    <div class="ttl" id="ttl"></div>
    <div class="sub" id="sub"></div>
    <div class="rule" id="rule"></div>
  </div>
  <div class="brand clip" id="brand" data-start="0" data-duration="7"><span class="mark"><b></b><b></b><b></b><b></b></span>WBS Builder</div>
  <div class="foot clip" id="foot" data-start="0" data-duration="7">Complete training</div>
</div>
<script>
const v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
const kind = v.kind || 'section', D = +v.dur || 4;
document.getElementById('kick').textContent = v.kicker || '';
document.getElementById('num').textContent = v.num || '';
document.getElementById('ttl').textContent = v.title || '';
document.getElementById('sub').textContent = v.sub || '';
if (!v.num) document.getElementById('num').style.display = 'none';
if (kind === 'title') { document.getElementById('ttl').style.fontSize = '118px'; document.getElementById('foot').textContent = 'Plan · Track · Report'; }
const tl = gsap.timeline({ paused: true });
const bars = ['#b1','#b2','#b3','#b4','#b5','#b6','#b7'];
tl.fromTo('#grid', { opacity: 0 }, { opacity: 1, duration: .6, ease: 'power2.out' }, 0);
bars.forEach((b, i) => tl.fromTo(b + ' i', { scaleX: 0, transformOrigin: 'left center' }, { scaleX: 1, duration: .7, ease: 'expo.out' }, .15 + i * .07));
tl.fromTo('#bars', { x: 60 }, { x: -20, duration: D, ease: 'none' }, 0);
tl.fromTo('#kick', { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, .2);
tl.fromTo('#num', { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: .7, ease: 'expo.out' }, .3);
tl.fromTo('#ttl', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: .7, ease: 'expo.out' }, .42);
tl.fromTo('#sub', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .6);
tl.fromTo('#rule', { scaleX: 0 }, { scaleX: 1, duration: .6, ease: 'expo.out' }, .7);
tl.fromTo(['#brand', '#foot'], { opacity: 0 }, { opacity: 1, duration: .6 }, .5);
// exit
tl.to(['#lbl', '#bars', '#brand', '#foot', '#grid'], { opacity: 0, duration: .45, ease: 'power2.in' }, D - .5);
window.__timelines["main"] = tl;
tl.seek(0);
</script>
</body>
</html>
