# Release to Google Cloud (Dammam): build the image, push it to Artifact Registry, roll it out.
# Runs on a v* tag, or by hand. Needs the repository variables printed by `terraform output github_variables`.
name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # keyless sign-in to Google Cloud

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # add required reviewers to this environment (Settings → Environments) to approve each release
    environment: production
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/wbs-master/app:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push the image
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Roll out the app (migrations run as it starts)
        run: gcloud run deploy wbs-master --image "$IMAGE" --region "${{ vars.GCP_REGION }}" --quiet
      - name: Update the daily digest job
        run: gcloud run jobs update wbs-master-digest --image "$IMAGE" --region "${{ vars.GCP_REGION }}" --quiet
