name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: wbs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/wbs_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: wbs_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/wbs_dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Start a fake Moyasar (payment gateway)
        working-directory: apps/web
        run: node e2e/fake-moyasar.mjs 4010 > /tmp/moyasar.log 2>&1 &
      - name: Start the app (API serving the built web app)
        working-directory: apps/api
        run: |
          PORT=3000 WEB_DIST=../web/dist APP_URL=http://localhost:3000 SSO_ALLOW_HTTP=1 \
            MOYASAR_SECRET_KEY=sk_test_e2e MOYASAR_WEBHOOK_SECRET=whsec_e2e MOYASAR_API_URL=http://127.0.0.1:4010/v1 \
            node dist/server.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3000/api/health && exit 0; sleep 1; done
          cat /tmp/api.log; exit 1
      - name: Browser smoke test
        working-directory: apps/web
        run: ../../scripts/ci-e2e.sh "Browser smoke test" env WEB_URL=http://localhost:3000 node e2e/smoke.mjs
      - name: Two-person live editing test
        working-directory: apps/web
        run: ../../scripts/ci-e2e.sh "Two-person live editing" env WEB_URL=http://localhost:3000 node e2e/collab.mjs
      - name: Excel round-trip test
        working-directory: apps/web
        run: ../../scripts/ci-e2e.sh "Excel round trip" env WEB_URL=http://localhost:3000 node e2e/excel.mjs
      - name: Portfolio and comments test
        working-directory: apps/web
        run: ../../scripts/ci-e2e.sh "Portfolio and comments" env WEB_URL=http://localhost:3000 node e2e/portfolio.mjs
      - name: Notifications test
        working-directory: apps/web
        run: ../../scripts/ci-e2e.sh "Notifications" env WEB_URL=http://localhost:3000 node e2e/notifications.mjs
      - name: API keys and webhooks test
        working-directory: apps/web
        run: ../../scripts/ci-e2e.sh "API keys and webhooks" env WEB_URL=http://localhost:3000 node e2e/integrations.mjs
      - name: Single sign-on test
        working-directory: apps/web
        run: ../../scripts/ci-e2e.sh "Single sign-on" env WEB_URL=http://localhost:3000 node e2e/sso.mjs
      - name: Billing test
        working-directory: apps/web
        run: ../../scripts/ci-e2e.sh "Billing" env WEB_URL=http://localhost:3000 node e2e/billing.mjs

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t wbs-master:ci .

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
